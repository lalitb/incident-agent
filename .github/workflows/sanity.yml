name: Offline sanity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install agent dependencies
        run: python -m pip install .

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q agent demo evaluations tests

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Validate Compose configurations
        run: |
          docker compose -f telemetry-lab/compose.yaml config --quiet
          docker compose -f telemetry-lab/compose.yaml -f exercises/clickhouse/compose.yaml config --quiet
